<svg xmlns="http://www.w3.org/2000/svg" width="900" height="28" viewBox="0 0 900 28">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#ff2bd6" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#ff2bd6"/>
      <stop offset="0.5" stop-color="#00e5ff"/>
      <stop offset="0.85" stop-color="#39ff14"/>
      <stop offset="1" stop-color="#39ff14" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-5%" y="-200%" width="110%" height="500%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <mask id="m"><rect x="0" y="12" width="900" height="4" rx="2" fill="url(#g)"/></mask>
  </defs>
  <style>
    .beam { animation: run 3.2s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes run { from { transform: translateX(-260px); } to { transform: translateX(900px); } }
  </style>
  <rect x="0" y="13" width="900" height="2" fill="url(#g)" filter="url(#glow)"/>
  <g mask="url(#m)">
    <rect class="beam" x="0" y="10" width="260" height="8" fill="url(#beam)"/>
  </g>
  <g fill="#8b949e" font-family="Menlo, Consolas, monospace" font-size="10" opacity="0.7">
    <text x="0" y="8">▸▸▸</text>
    <text x="900" y="8" text-anchor="end">◂◂◂</text>
  </g>
</svg>
